<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">R Medical Graphics logo</title>
  <desc id="desc">Horizontal logo for the R Medical Graphics skill, with a secondary journal style calibrator cue.</desc>
  <defs>
    <style>
      .ink { fill: #0f172a; }
      .muted { fill: #475569; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .axis { stroke: #334155; stroke-width: 7; }
      .teal { stroke: #0f766e; }
      .coral { stroke: #e45757; }
      .gold { stroke: #d97706; }
      .tick { stroke: #94a3b8; stroke-width: 4; }
      .wordmark { font-family: Inter, Segoe UI, Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <g id="mark" transform="translate(46 40)">
    <rect x="0" y="0" width="280" height="280" rx="54" fill="#f8fafc" stroke="#d7dee8" stroke-width="4"/>
    <circle cx="140" cy="140" r="106" fill="none" stroke="#dbe4ef" stroke-width="12"/>
    <circle cx="140" cy="140" r="106" fill="none" stroke="#334155" stroke-width="4"/>

    <g transform="translate(140 140)">
      <line class="tick" x1="0" y1="-124" x2="0" y2="-107"/>
      <line class="tick" x1="62" y1="-107.39" x2="53.5" y2="-92.66"/>
      <line class="tick" x1="107.39" y1="-62" x2="92.66" y2="-53.5"/>
      <line class="tick" x1="124" y1="0" x2="107" y2="0"/>
      <line class="tick" x1="107.39" y1="62" x2="92.66" y2="53.5"/>
      <line class="tick" x1="62" y1="107.39" x2="53.5" y2="92.66"/>
      <line class="tick" x1="0" y1="124" x2="0" y2="107"/>
      <line class="tick" x1="-62" y1="107.39" x2="-53.5" y2="92.66"/>
      <line class="tick" x1="-107.39" y1="62" x2="-92.66" y2="53.5"/>
      <line class="tick" x1="-124" y1="0" x2="-107" y2="0"/>
      <line class="tick" x1="-107.39" y1="-62" x2="-92.66" y2="-53.5"/>
      <line class="tick" x1="-62" y1="-107.39" x2="-53.5" y2="-92.66"/>
    </g>

    <path class="line axis" d="M76 217V92M76 217h148"/>
    <rect x="126" y="170" width="18" height="47" rx="4" fill="#8dd3c7" opacity=".78"/>
    <rect x="157" y="136" width="18" height="81" rx="4" fill="#f6b4ae" opacity=".74"/>
    <rect x="188" y="154" width="18" height="63" rx="4" fill="#f8d27a" opacity=".82"/>

    <text class="wordmark ink" x="92" y="181" font-size="112" font-weight="800" letter-spacing="0">R</text>
    <path class="line teal" d="M94 204C123 180 140 183 159 154C180 122 199 123 222 90" stroke-width="10"/>
    <circle cx="94" cy="204" r="7" fill="#0f766e"/>
    <circle cx="159" cy="154" r="7" fill="#0f766e"/>
    <circle cx="222" cy="90" r="7" fill="#0f766e"/>

    <g transform="translate(211 55)">
      <circle cx="0" cy="0" r="24" fill="#fff7ed" stroke="#f2c078" stroke-width="4"/>
      <path class="line coral" d="M-12 0h24M0-12v24" stroke-width="7"/>
    </g>

    <g transform="translate(238 218)">
      <circle cx="0" cy="0" r="18" fill="#fff" stroke="#d97706" stroke-width="6"/>
      <path class="line gold" d="M-8 8L8-8" stroke-width="5"/>
    </g>
  </g>

  <g class="wordmark" transform="translate(378 103)">
    <text class="ink" x="0" y="0" font-size="62" font-weight="800" letter-spacing="0">R Medical Graphics</text>
    <text class="muted" x="2" y="49" font-size="28" font-weight="500" letter-spacing="0">Publication-ready medical figures in R</text>

    <g transform="translate(4 111)">
      <path class="line" d="M0 0h486" stroke="#cbd5e1" stroke-width="3"/>
      <circle cx="0" cy="0" r="7" fill="#0f766e"/>
      <circle cx="122" cy="0" r="7" fill="#2563eb"/>
      <circle cx="244" cy="0" r="7" fill="#e45757"/>
      <circle cx="366" cy="0" r="7" fill="#d97706"/>
      <circle cx="486" cy="0" r="7" fill="#334155"/>
      <text class="muted" x="0" y="46" font-size="23" font-weight="650" letter-spacing="0">with journal style calibrator</text>
    </g>

  </g>
</svg>
