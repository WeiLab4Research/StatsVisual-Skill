<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="280" viewBox="0 0 1200 280"
     role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">How StatsVisual-Skill Works</title>
  <desc id="wf-desc">工作流：用户提供数据 → AI 数据画像 → 推荐合适图形 → 用户确认 → 生成 R 代码 → 导出出版图</desc>

  <rect width="1200" height="280" rx="24" fill="#FAFBFC" stroke="#E5E8EB" stroke-width="1"/>

  <!-- Step 1 -->
  <g transform="translate(50 60)">
    <rect width="180" height="160" rx="14" fill="white" stroke="#E5E8EB" stroke-width="1.5"/>
    <circle cx="90" cy="38" r="22" fill="#2C6FAC" opacity="0.1"/>
    <text x="90" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" fill="#2C6FAC">📊</text>
    <text x="90" y="82" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#1A1D23" font-weight="600">提供数据</text>
    <text x="90" y="106" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8899A6">CSV / TSV / XLSX</text>
    <text x="90" y="122" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8899A6">RDS / 临床数据</text>
    <text x="90" y="146" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#2C6FAC">Step 1</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="238" y1="140" x2="282" y2="140" stroke="#D0D5DA" stroke-width="2"/>
  <polygon points="282,135 292,140 282,145" fill="#D0D5DA"/>

  <!-- Step 2 -->
  <g transform="translate(300 60)">
    <rect width="180" height="160" rx="14" fill="white" stroke="#E5E8EB" stroke-width="1.5"/>
    <circle cx="90" cy="38" r="22" fill="#2C6FAC" opacity="0.1"/>
    <text x="90" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" fill="#2C6FAC">🔍</text>
    <text x="90" y="82" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#1A1D23" font-weight="600">数据画像</text>
    <text x="90" y="106" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8899A6">变量类型识别</text>
    <text x="90" y="122" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8899A6">分布特征分析</text>
    <text x="90" y="146" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#2C6FAC">Step 2</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="488" y1="140" x2="532" y2="140" stroke="#D0D5DA" stroke-width="2"/>
  <polygon points="532,135 542,140 532,145" fill="#D0D5DA"/>

  <!-- Step 3 -->
  <g transform="translate(550 60)">
    <rect width="180" height="160" rx="14" fill="white" stroke="#E5E8EB" stroke-width="1.5"/>
    <circle cx="90" cy="38" r="22" fill="#2C6FAC" opacity="0.1"/>
    <text x="90" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" fill="#2C6FAC">💡</text>
    <text x="90" y="82" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#1A1D23" font-weight="600">推荐图形</text>
    <text x="90" y="106" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8899A6">首选 + 备选方案</text>
    <text x="90" y="122" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8899A6">可选多面板组图</text>
    <text x="90" y="146" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#E0554A">等待确认</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="738" y1="140" x2="782" y2="140" stroke="#D0D5DA" stroke-width="2"/>
  <polygon points="782,135 792,140 782,145" fill="#D0D5DA"/>

  <!-- Step 4 -->
  <g transform="translate(800 60)">
    <rect width="180" height="160" rx="14" fill="white" stroke="#2C6FAC" stroke-width="2"/>
    <circle cx="90" cy="38" r="22" fill="#2C6FAC" opacity="0.15"/>
    <text x="90" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" fill="#2C6FAC">⚡</text>
    <text x="90" y="82" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#1A1D23" font-weight="600">生成图形</text>
    <text x="90" y="106" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8899A6">R 脚本自动生成</text>
    <text x="90" y="122" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8899A6">PDF / SVG / TIFF</text>
    <text x="90" y="146" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#2C6FAC">Step 4</text>
  </g>

  <!-- Bottom: journal style badge row -->
  <g transform="translate(50 244)">
    <rect x="0" y="0" width="58" height="18" rx="9" fill="#2C6FAC" opacity="0.1"/>
    <text x="29" y="13" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#2C6FAC">Lancet</text>

    <rect x="68" y="0" width="52" height="18" rx="9" fill="#2C6FAC" opacity="0.1"/>
    <text x="94" y="13" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#2C6FAC">NEJM</text>

    <rect x="130" y="0" width="52" height="18" rx="9" fill="#2C6FAC" opacity="0.1"/>
    <text x="156" y="13" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#2C6FAC">JAMA</text>

    <rect x="192" y="0" width="48" height="18" rx="9" fill="#2C6FAC" opacity="0.1"/>
    <text x="216" y="13" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#2C6FAC">BMJ</text>

    <rect x="250" y="0" width="58" height="18" rx="9" fill="#2C6FAC" opacity="0.1"/>
    <text x="279" y="13" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#2C6FAC">Nature</text>

    <rect x="318" y="0" width="68" height="18" rx="9" fill="#8899A6" opacity="0.12"/>
    <text x="352" y="13" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#8899A6">General</text>
  </g>
</svg>
