<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="s2-title s2-desc">
  <title id="s2-title">Gallery — Three Comparisons</title>
  <desc id="s2-desc">三组绘图效果对比：四大期刊、国内外模型、有无书籍支撑</desc>

  <rect width="1200" height="140" rx="20" fill="#FAFBFC" stroke="#E5E8EB" stroke-width="1"/>

  <text x="60" y="50" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#8899A6" font-weight="500" letter-spacing="3">
    02
  </text>

  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#E0554A"/>

  <text x="60" y="94" font-family="Georgia, Songti SC, serif" font-size="30" fill="#1A1D23" font-weight="700">
    效果展示
  </text>
  <text x="230" y="94" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" fill="#8899A6" font-weight="400">
    三组对比：期刊风格 · 模型差异 · 思想支撑
  </text>

  <!-- Right decorative: comparison circles -->
  <g transform="translate(1060 48)" opacity="0.3">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#2C6FAC" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="none" stroke="#E0554A" stroke-width="2"/>
    <circle cx="60" cy="20" r="18" fill="none" stroke="#2C6FAC" stroke-width="2"/>
  </g>
</svg>
