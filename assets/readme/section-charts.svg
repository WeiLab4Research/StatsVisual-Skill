<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="s1-title s1-desc">
  <title id="s1-title">Chart Types — 16 Statistical Chart Families</title>
  <desc id="s1-desc">16 种统计图形大类概览，每种图形均含 4 个变体示例</desc>

  <rect width="1200" height="140" rx="20" fill="#FAFBFC" stroke="#E5E8EB" stroke-width="1"/>

  <!-- Section number -->
  <text x="60" y="50" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#8899A6" font-weight="500" letter-spacing="3">
    01
  </text>

  <!-- Accent bar -->
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#2C6FAC"/>

  <!-- Title -->
  <text x="60" y="94" font-family="Georgia, Songti SC, serif" font-size="30" fill="#1A1D23" font-weight="700">
    图形大类
  </text>
  <text x="230" y="94" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" fill="#8899A6" font-weight="400">
    16 种统计图形，每种含 4 个变体示例
  </text>

  <!-- Right decorative: tiny bar chart -->
  <g transform="translate(1060 38)" opacity="0.3">
    <rect x="0" y="50" width="16" height="20" rx="3" fill="#2C6FAC"/>
    <rect x="24" y="30" width="16" height="40" rx="3" fill="#2C6FAC"/>
    <rect x="48" y="15" width="16" height="55" rx="3" fill="#2C6FAC"/>
    <rect x="72" y="35" width="16" height="35" rx="3" fill="#E0554A"/>
  </g>
</svg>
