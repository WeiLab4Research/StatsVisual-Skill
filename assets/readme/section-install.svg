<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="s3-title s3-desc">
  <title id="s3-title">Installation &amp; Quick Start</title>
  <desc id="s3-desc">安装指南与快速上手：git clone 后复制到 skills 目录即可使用</desc>

  <rect width="1200" height="140" rx="20" fill="#FAFBFC" stroke="#E5E8EB" stroke-width="1"/>

  <text x="60" y="50" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#8899A6" font-weight="500" letter-spacing="3">
    03
  </text>

  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#2C6FAC"/>

  <text x="60" y="94" font-family="Georgia, Songti SC, serif" font-size="30" fill="#1A1D23" font-weight="700">
    安装与上手
  </text>
  <text x="230" y="94" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" fill="#8899A6" font-weight="400">
    git clone → 复制到 skills 目录 → 发送数据让 AI 推荐绘图
  </text>

  <!-- Right decorative: terminal prompt -->
  <g transform="translate(1000 38)" opacity="0.25">
    <rect width="150" height="60" rx="8" fill="#1A1D23"/>
    <text x="12" y="24" font-family="ui-monospace, monospace" font-size="10" fill="#8899A6">$ git clone ...</text>
    <text x="12" y="40" font-family="ui-monospace, monospace" font-size="10" fill="#4CAF50">✓ installed</text>
    <text x="12" y="54" font-family="ui-monospace, monospace" font-size="10" fill="#8899A6">█</text>
  </g>
</svg>
